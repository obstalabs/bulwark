[package]
name = "bulwark"
version = "0.9.3"
edition = "2021"
description = "Kernel-boundary file-read gate for AI agent process trees (Linux fanotify MVP)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/obstalabs/bulwark"
readme = "README.md"
rust-version = "1.74"

[[bin]]
name = "bulwark"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# WO-29: dispatch-time hivebus key handoff. ed25519 worker identity + fingerprint.
# Minimal surface for a security binary: dalek without the heavy `rand` feature
# (seed comes from getrandom = the OS CSPRNG directly), sha2 for the fingerprint,
# base64 to match hivebus `answer --signing-key` (StdEncoding). Hex is hand-rolled.
ed25519-dalek = "2"
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"

[features]
# WO-147/155@v1 (fault-injection): compile IN the test-only reaping-layer
# switches (`BULWARK_TEST_NO_CGROUP` / `BULWARK_TEST_NO_PDEATHSIG`). OFF by
# default and never enabled in release/CI release builds — with the feature
# absent, the code paths that read those variables do not compile, so a shipped
# binary cannot have its reaping layers disabled by a stray environment
# variable. Only the tests that isolate a single reaping layer enable it.
fault-injection = []

[dev-dependencies]
# Integration tests send signals to the supervisor to exercise fail-closed.
libc = "0.2"
# WO-198@v1: the decision-rule conformance vectors are JSON so every evaluator
# (Rust, the macOS gate, a kernel program) reads the same file.
serde_json = "1"

[profile.release]
opt-level = 2
