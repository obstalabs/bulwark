name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build + test (linux)
    # GitHub-hosted Ubuntu runner — free + unlimited for public repos, and no
    # self-hosted box is exposed to PR authors. fanotify/Landlock are kernel
    # features; the hosted runner's kernel supports the permission-event gate and
    # passwordless sudo for the root integration steps below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # WO-135@v2: aarch64 gnu is cross-built below for the glibc floor check.
          targets: x86_64-apple-darwin, x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      # WO-40: compile the Rust macOS cfg path on the existing Linux runner.
      # `cargo check` does not link an Apple binary, but it catches gate_macos.rs
      # type errors that Linux-only CI used to miss.
      - name: macOS Rust cfg check
        run: cargo check --target x86_64-apple-darwin --verbose

      # Build the static musl gate on every PR. The musl target is what the
      # streamable remote-deploy path ships, but it only built on release tags
      # before — so musl-only defects (e.g. ioctl signature differences) and the
      # static-linkage assertion went unexercised until a tag. Build + assert
      # here so those are caught pre-merge. x86_64 native musl needs no cross.
      - name: Build static musl gate
        run: cargo build --release --target x86_64-unknown-linux-musl --verbose

      - name: Assert static linkage (musl)
        run: |
          bin="target/x86_64-unknown-linux-musl/release/bulwark"
          file "$bin"
          # Accept both "statically linked" and the newer "static-pie linked".
          if ! file "$bin" | grep -qiE "statically linked|static-pie linked"; then
            echo "::error::musl gate is not reported static by file()"
            file "$bin"
            exit 1
          fi
          # Phrasing-agnostic no-deps gate: a static binary has no "=>" deps.
          ldd "$bin" > ldd.out 2>&1 || true
          if grep -q "=>" ldd.out; then
            echo "::error::musl gate is not a fully static binary (has dynamic deps)"
            cat ldd.out
            exit 1
          fi

      # WO-135@v2: the release gnu binaries are built with cross so they link
      # against an older glibc than ubuntu-latest's 2.39 (0.9.1 shipped an x86_64
      # binary that needed 2.39). Build BOTH gnu targets the same way here and
      # run the shared floor guard (scripts/check-glibc-floor.sh, the same one
      # release.yml runs) on each, so a regression is caught before a tag.
      # readelf reads the aarch64 ELF on this x86_64 runner; nothing is executed.
      - name: Install cross (gnu floor check)
        run: cargo install cross --locked

      - name: Build gnu targets via cross (release shape)
        run: |
          cross build --release --target x86_64-unknown-linux-gnu
          cross build --release --target aarch64-unknown-linux-gnu

      - name: Assert glibc floor (gnu, cross builds)
        run: |
          scripts/check-glibc-floor.sh target/x86_64-unknown-linux-gnu/release/bulwark
          scripts/check-glibc-floor.sh target/aarch64-unknown-linux-gnu/release/bulwark

      - name: Unit tests
        run: cargo test --verbose

      # WO-172@v1: the ES proof seal checks are plain bash + grep, so they run here
      # on every push instead of waiting for a macOS runner.
      - name: ES proof seal source checks
        run: bash macos-es-proof/prove_test.sh

      # WO-140@v1: keep release upload refusal covered without release credentials.
      - name: macOS release seal gate fixtures
        run: bash macos-es-proof/release_gate_test.sh

      # WO-140@v1: exercise boundary acknowledgement against isolated histories.
      - name: Hardware seal acknowledgement fixtures
        run: bash scripts/check-seal-ack_test.sh

      # WO-155@v1: `fault-injection` is debug-only (it lets a test disable a
      # reaping layer). A release build that enables it must NOT compile — assert
      # the build fails; a success here means the test switches shipped.
      - name: Fault-injection must not compile in release
        run: |
          # It must fail, AND fail with THIS exact compile_error! diagnostic — a
          # success, or a failure for any other reason, is a regression.
          err=$(cargo build --release --all-features 2>&1) || true
          if printf '%s\n' "$err" | grep -qF 'the `fault-injection` feature is debug-only; do not enable it in a release build'; then
            exit 0
          fi
          echo "::error::release --all-features must fail with the fault-injection compile_error! diagnostic (it succeeded or failed for another reason)"
          printf '%s\n' "$err"
          exit 1

      # WO-151@v1: exercise the unreadable-state path before privileged tests.
      # WO-176@v1: print Cargo diagnostics before failing the non-root check.
      - name: Integrity EACCES test (non-root)
        run: |
          output=$(cargo test --bin bulwark integrity::tests::eacces_state_file_starts_tainted_and_preserves_evidence -- --ignored --exact 2>&1) || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -qF 'test result: ok. 1 passed;' <<<"$output"

      # WO-36: the integration tests need root (fanotify CAP_SYS_ADMIN, Landlock).
      # Resolve a root-runner prefix once: empty when already root, else `sudo -E`.
      # This works on both a passwordless-sudo runner and a runner that runs as
      # root (no sudo binary), instead of hard-coding `sudo` and failing with
      # "sudo: command not found".
      - name: Resolve privileged runner
        id: priv
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "run=" >> "$GITHUB_OUTPUT"
          elif command -v sudo >/dev/null 2>&1; then
            echo "run=sudo -E" >> "$GITHUB_OUTPUT"
          else
            echo "::error::integration tests need root but this runner is non-root and has no sudo"
            exit 1
          fi

      - name: Integration tests (live fanotify gate, root)
        run: ${{ steps.priv.outputs.run }} "$(command -v cargo)" test --test gate_integration -- --ignored --test-threads=1

      - name: Consent socket integration tests (off-band, root)
        run: ${{ steps.priv.outputs.run }} "$(command -v cargo)" test --test consent_socket -- --ignored --test-threads=1

      - name: Hardening integration tests (bind-mount, graceful teardown, root)
        run: ${{ steps.priv.outputs.run }} "$(command -v cargo)" test --test hardening -- --ignored --test-threads=1

      - name: Allow-list CI mode integration tests (default-deny, root)
        run: ${{ steps.priv.outputs.run }} "$(command -v cargo)" test --test allowlist_ci -- --ignored --test-threads=1

      - name: Hardened mode integration tests (Landlock floor, root)
        run: ${{ steps.priv.outputs.run }} "$(command -v cargo)" test --test hardened_landlock -- --ignored --test-threads=1

      - name: Remote consent integration tests (decision/prompt split, root)
        run: ${{ steps.priv.outputs.run }} "$(command -v cargo)" test --test remote_consent -- --ignored --test-threads=1

      - name: Integrity taint integration tests (policy digest, root)
        run: ${{ steps.priv.outputs.run }} "$(command -v cargo)" test --test integrity_taint -- --ignored --test-threads=1

      # WO-155@v1: the reaping-layer tests. Default build (the fault-injection
      # switches are compiled out — a default build must ignore them) and a debug
      # build with the fault-injection feature (each reaping layer provable).
      - name: Supervisor reaping tests (default build, root)
        run: ${{ steps.priv.outputs.run }} "$(command -v cargo)" test --test gate_supervisor -- --ignored --test-threads=1

      - name: Supervisor reaping tests (fault-injection, root)
        run: ${{ steps.priv.outputs.run }} "$(command -v cargo)" test --test gate_supervisor --features fault-injection -- --ignored --test-threads=1

  # WO-140@v1: flag pull requests that cross the hardware-sealed boundary.
  hardware-seal-ack:
    name: hardware seal acknowledgement
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # WO-140@v1: commit bodies and the complete base range are gate inputs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # WO-140@v1: require the exact marker for paths in boundary-paths.txt.
      # WO-175@v1: select the base runner before it selects the base checker and list.
      - name: Check hardware seal acknowledgement
        # WO-140@v1: keep the expression value out of shell source text.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          runner="$RUNNER_TEMP/run-seal-ack.sh"
          if git show "origin/$BASE_REF:scripts/run-seal-ack.sh" > "$runner" 2>/dev/null; then
            :
          else
            echo "[bulwark] base branch lacks the seal-ack runner; using the head copy"
            git show "HEAD:scripts/run-seal-ack.sh" > "$runner"
          fi
          bash "$runner" "origin/$BASE_REF"

  supply-chain:
    name: supply-chain (cargo-deny)
    # Audits the dependency tree on every PR: RustSec security advisories, yanked
    # crates, license compatibility (the allow-list in deny.toml), and crate
    # sources. Policy lives in deny.toml. Runs on the free hosted runner — no
    # privileged steps, so it does not need the self-hosted box.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  macos-swift-edge:
    name: macOS Swift ES edge compile
    # WO-40: enable after registering a self-hosted macOS runner. The current
    # repo runner inventory has only nullbot-1 (Linux/ARM64), so leaving this
    # gated avoids a permanently queued required check while preserving the exact
    # compile/link path that should become mandatory on the first Mac runner.
    if: ${{ vars.BULWARK_MACOS_SWIFT_CI == 'true' }}
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Typecheck Swift ES clients
        run: |
          mkdir -p "$RUNNER_TEMP/swift-module-cache"
          xcrun --sdk macosx swiftc -typecheck macos-es-proof/es_proof.swift -lEndpointSecurity -lbsm -module-cache-path "$RUNNER_TEMP/swift-module-cache"
          xcrun --sdk macosx swiftc -typecheck macos-es-proof/es_gate.swift -lEndpointSecurity -lbsm -module-cache-path "$RUNNER_TEMP/swift-module-cache"

      - name: Link Swift ES clients
        run: |
          mkdir -p "$RUNNER_TEMP/swift-module-cache"
          xcrun --sdk macosx swiftc -o "$RUNNER_TEMP/es_proof" macos-es-proof/es_proof.swift -lEndpointSecurity -lbsm -module-cache-path "$RUNNER_TEMP/swift-module-cache"
          xcrun --sdk macosx swiftc -o "$RUNNER_TEMP/bulwark_es_gate" macos-es-proof/es_gate.swift -lEndpointSecurity -lbsm -module-cache-path "$RUNNER_TEMP/swift-module-cache"

      # WO-172@v1: pin the ES proof client's AUTH-callback deadline-safety invariants.
      - name: ES proof client source checks
        run: xcrun --sdk macosx swift macos-es-proof/es_proof_test.swift
